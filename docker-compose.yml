name: paysim-big-data-baseline

x-hadoop-runtime: &hadoop-runtime
  build:
    context: ./hadoop
  init: true

services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic paysim.transactions
        --partitions 3
        --replication-factor 1
    restart: "no"

  hdfs-init:
    <<: *hadoop-runtime
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:100 /data/name /data/data"]
    volumes:
      - hdfs_namenode:/data/name
      - hdfs_datanode:/data/data
    restart: "no"

  namenode:
    <<: *hadoop-runtime
    hostname: namenode
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_namenode:/data/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/hdfs-healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 60s
    mem_limit: 1g
    restart: unless-stopped

  datanode:
    <<: *hadoop-runtime
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_started
    ports:
      - "9864:9864"
    volumes:
      - hdfs_datanode:/data/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    mem_limit: 1g
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    hostname: mongodb
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  spark:
    build:
      context: ./spark
    hostname: spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: paysim.transactions
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: paysim
      HDFS_BASE: hdfs://namenode:9000/data/paysim
      MODEL_PATH: hdfs://namenode:9000/data/paysim/models/baseline
      CHECKPOINT_PATH: hdfs://namenode:9000/data/paysim/checkpoints/scoring
      DATA_PATH: file:///data/paysim.csv
      TRAIN_MAX_ROWS: ${TRAIN_MAX_ROWS:-300000}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-1000}
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-10}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.50}
      HDFS_STARTUP_TIMEOUT_SECONDS: ${HDFS_STARTUP_TIMEOUT_SECONDS:-300}
      HDFS_RETRY_INTERVAL_SECONDS: ${HDFS_RETRY_INTERVAL_SECONDS:-5}
      PYSPARK_PYTHON: python3
      HADOOP_CONF_DIR: /opt/hadoop-conf
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.ui.requestHeaderSize=64k
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0
      - /opt/app/pipeline.py
    ports:
      - "4040:4040"
    volumes:
      - ${PAYSIM_DATA_PATH:-./data/paysim.csv}:/data/paysim.csv:ro
      - ./hadoop/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pipeline-ready"]
      interval: 10s
      timeout: 3s
      retries: 90
      start_period: 60s
    mem_limit: 3g
    restart: unless-stopped

  replayer:
    build:
      context: ./replayer
    depends_on:
      spark:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DATA_PATH: /data/paysim.csv
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: paysim.transactions
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: paysim
      MAX_EVENTS: ${MAX_EVENTS:-0}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-50}
      DATASET_ROWS: 6362620
      LOOP_DATASET: ${LOOP_DATASET:-true}
      START_ROW: ${START_ROW:-1}
      RANDOM_SEED: ${RANDOM_SEED:-2026}
      RUN_ID: ${RUN_ID:-}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0}
      NULL_RATE: ${NULL_RATE:-0}
      LATE_EVENT_RATE: ${LATE_EVENT_RATE:-0}
    volumes:
      - ${PAYSIM_DATA_PATH:-./data/paysim.csv}:/data/paysim.csv:ro
    restart: unless-stopped

  streamlit:
    build:
      context: ./dashboard
    hostname: streamlit
    depends_on:
      mongodb:
        condition: service_healthy
      spark:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: paysim
    ports:
      - "8501:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  kafka_data:
  hdfs_namenode:
  hdfs_datanode:
  mongo_data:
